# Global settings
bind r run-shell 'tmux source-file "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux.conf"'

set -g prefix C-s
set -g mouse on
set -g default-terminal tmux-256color
set -g base-index 1
setw -g pane-base-index 1

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Open new splits in the current pane's directory (default is the dir the tmux
# server started in). new-window (prefix c) intentionally left at the default.
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Show clock (default prefix+t, moved since t now opens the popup shell)
bind a clock-mode

# Popup shell at the root of the current repo
bind t run-shell '\
  DIR=$(git -C "#{pane_current_path}" rev-parse --show-toplevel 2>/dev/null || echo "#{pane_current_path}"); \
  SESSION="shell-$(echo $DIR | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "$DIR"; \
  tmux display-popup -w35% -h30% \
    -x#{e|-:#{e|/:#{e|*:#{client_width},65},100},3} \
    -y#{e|/:#{e|*:#{client_height},8},10} \
    -E "tmux attach-session -t $SESSION"'

# New window in a directory picked with fzf from zoxide's frecency list.
# Esc/C-c in fzf aborts without opening a window.
bind e display-popup -w60% -h50% -E '\
  dir=$(zoxide query --list | fzf --reverse --prompt "window> " \
    --preview "ls -1F --color=always {}") && \
  tmux new-window -c "$dir"'

bind C-k clear-history

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'nordtheme/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-urlview'
set -g @plugin 'craftzdog/tmux-claude-session-manager'

# Keep the session picker off prefix+u, which tmux-urlview owns (default is 'u')
set -g @claude_list_key 'b'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/plugins/tpm/tpm"'

# tmux >= 3.7 draws the command prompt / messages into an area painted by the
# `fill=` directive of message-style; without it the area is not cleared and the
# old status line (window list, clock, host) stays visible under the prompt.
# Nord's message styles predate that, so re-add fill. Must come after tpm.
# (Nord) set -g message-style "bg=brightblack,fg=cyan,fill=brightblack"
# (ANSI white) set -g message-style "bg=white,fg=cyan,fill=white"
# (Dawnfox) set -g message-style "bg=#ebe5df,fg=cyan,fill=#ebe5df"
set -g message-style "bg=#d8dee9,fg=cyan,fill=#d8dee9"
# (Nord) set -g message-command-style "bg=brightblack,fg=cyan,fill=brightblack"
# (ANSI white) set -g message-command-style "bg=white,fg=cyan,fill=white"
# (Dawnfox) set -g message-command-style "bg=#ebe5df,fg=cyan,fill=#ebe5df"
set -g message-command-style "bg=#d8dee9,fg=cyan,fill=#d8dee9"

# ── Status line ──────────────────────────────────────────────────────────────
# Rosé Pine's layout, in Nord's colours. This replaces the whole status line the
# nordtheme plugin builds — its chunky powerline blocks — with flat text on the
# bar background: each field is <value> then a muted separator and a Nerd Font
# icon. Everything the plugin does *outside* the status line (pane borders,
# message styles, display-panes, clock) is left alone. Must come after tpm.
#
# Colours are named, not hex, so they resolve through the terminal palette that
# kitty themes as Nord (kitty/themes/dark.conf) — the same source the plugin
# draws from. black #3b4252, brightblack #4c566a, blue #81a1c1,
# brightblue #5e81ac, cyan #88c0d0, magenta #b48ead, yellow #ebcb8b,
# red #bf616a, white #e5e9f0.
#
# Nothing here uses `brightblack`, which is the obvious pick for Rosé Pine's
# muted role and the wrong one. Rosé Pine dims separators and icons to subtle
# #908caa against base #191724 — a wide luminance gap. The same move in Nord is
# brightblack #4c566a on black #3b4252, which is 1.4:1 and effectively
# invisible: the Polar Night shades are all dark and clustered together.
# So icons are `white`, matching the session icon on the left, and only the
# arrows stay dim at blue #81a1c1 (3.7:1).
#
# Currently Dayfox (kitty/themes/dayfox.conf), same layout. Every line that
# names a colour keeps its Nord version commented out as `# (Nord)` above it;
# swap them back together with kitty's theme. The only change is black <-> white:
# Dayfox is a light palette, so black #352c24 is the dark text and white #f2e9e1
# the bar (1.08:1 against the terminal's #f6f2ee, as subtle as Nord's 1.24:1).
# Left as-is on the dark bar, Dayfox's accents -- tuned for a light background --
# drop to 1.7-2.7:1; on the white bar they are 4.2-6.8:1. Side effect: the
# arrows are no longer dim -- Dayfox's blue #2848a9 is 6.8:1 on the bar.
#
# Bar background: Dawnfox bg0 #ebe5df -- nightfox's own status-line/float bg,
# a warm strip 1.14:1 darker than the terminal's #faf4ed. Replaces ANSI white
# (Dawnfox #e5e9f0), whose cool grey clashed with the warm background. Text on
# it: black 5.8, blue 4.9, red 3.4, magenta 3.0, cyan 2.7, yellow 1.8:1. Hex
# because no ANSI slot holds bg0.
#
# Now Nord light (kitty/themes/nord-light.conf): bar nord4 #d8dee9, Helix
# nord_light's statusline colour, 1.17:1 against the terminal's nord6 #eceff4.
# The `# (Dawnfox)` lines hold the previous bar. kitty's accents are darkened
# to 3.5:1 on nord6, which leaves every one at 3.0:1 on the bar (black 7.5:1),
# so the current-window yellow is no longer the faint one.
# (Nord) set -g status-style "fg=brightblue,bg=black"
# (ANSI white) set -g status-style "fg=brightblue,bg=white"
# (Dawnfox) set -g status-style "fg=brightblue,bg=#ebe5df"
set -g status-style "fg=brightblue,bg=#d8dee9"

# 200 because the fields overflow tmux's 10/40 defaults: status-left needs 17
# cells for the popup's shell-<hash> sessions, and status-right carries host +
# date + time + icons. Rosé Pine set these itself; Nord does not, so they live
# here — a truncated bar is the symptom if they go missing.
set -g status-left-length 200
set -g status-right-length 200

# Left: session name only. Rosé Pine also shows the active window's name here,
# which just repeats the flagged entry in the window list. The session icon
# turns red while the prefix is held — the only prefix indicator on the bar.
# (Nord) set -g status-left "#[fg=#{?client_prefix,red,white}] #[fg=white]#S  "
set -g status-left "#[fg=#{?client_prefix,red,black}] #[fg=black]#S  "

# Right: date, time, then hostname — the order the nordtheme plugin put them in.
# Trailing icon per field, muted arrow between value and icon.
# (Nord) set -g status-right "#[fg=cyan]%Y-%m-%d %H:%M#[fg=blue]  #[fg=white]󰃰  #[fg=white]#H#[fg=blue]  #[fg=white]󰒋  "
set -g status-right "#[fg=cyan]%Y-%m-%d %H:%M#[fg=blue]  #[fg=black]󰃰  #[fg=black]#H#[fg=blue]  #[fg=black]󰒋  "

# Window list centred, session name still hard left. `absolute-centre`, not
# plain `centre`: plain `centre` centres the list in what is left *after*
# status-left and status-right are drawn, so the wide right section (date + time
# + host ≈ 39 cells vs 5 on the left) drags the list ~17 cells left of the
# optical centre. `absolute-centre` measures from the bar itself and ignores both
# ends. tmux ≥ 3.3 only.
set -g status-justify absolute-centre

# Window list: tmux's built-in "#I:#W#F" body, coloured by state. The current
# window is also wrapped in brackets so it reads without relying on colour. Every
# entry is padded by one cell (inactive: spaces, current: brackets) and the
# separator is empty, so switching windows does not shift the centred list.
# (built-in formats) setw -gu window-status-format
# (built-in formats) setw -gu window-status-current-format
setw -g window-status-format " #I:#W#F "
setw -g window-status-current-format "[#I:#W#F]"
# (Nord) setw -g window-status-style "fg=magenta,bg=black"
# (ANSI white) setw -g window-status-style "fg=magenta,bg=white"
# (Dawnfox) setw -g window-status-style "fg=magenta,bg=#ebe5df"
# (red) setw -g window-status-style "fg=red,bg=#d8dee9"
setw -g window-status-style "fg=magenta,bg=#d8dee9"
# (Nord) setw -g window-status-current-style "fg=yellow,bg=black"
# (ANSI white) setw -g window-status-current-style "fg=yellow,bg=white"
# (Dawnfox) setw -g window-status-current-style "fg=yellow,bg=#ebe5df"
# (nord13 #ebcb8b) setw -g window-status-current-style "fg=#ebcb8b,bg=#d8dee9"
setw -g window-status-current-style "fg=yellow,bg=#d8dee9"
# (Nord) setw -g window-status-activity-style "fg=black,bg=blue"
setw -g window-status-activity-style "fg=white,bg=blue"
# (two spaces) setw -g window-status-separator "  "
setw -g window-status-separator ""
