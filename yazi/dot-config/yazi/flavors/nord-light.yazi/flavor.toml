# Nord light flavor, matching nvim/kitty/tmux. A copy of ../dawnfox.yazi/flavor.toml
# (itself ../nord.yazi with each Nord colour swapped for its Dawnfox role) with
# each Dawnfox role swapped for its Nord light colour -- the palette in
# nvim/dot-config/nvim/colors/nord-light.lua. Structure untouched. tmtheme.xml is
# bat/dot-config/bat/themes/nord-light.tmTheme.

# vim:fileencoding=utf-8:foldmethod=marker

# Nord Color Palette Reference:
# Polar Night:
#   nord0: #2E3440
#   nord1: #3B4252
#   nord2: #434C5E
#   nord3: #4C566A
# Snow Storm:
#   nord4: #D8DEE9
#   nord5: #E5E9F0
#   nord6: #ECEFF4
# Frost:
#   nord7: #8FBCBB (Minty Green/Cyan)
#   nord8: #88C0D0 (Light Blue)
#   nord9: #81A1C1 (Medium Blue)
#   nord10: #5E81AC (Darker Blue)
# Aurora:
#   nord11: #BF616A (Red)
#   nord12: #D08770 (Orange)
#   nord13: #EBCB8B (Yellow)
#   nord14: #A3BE8C (Green)
#   nord15: #B48EAD (Purple)


# : Manager {{{

[mgr]

# Current working directory - Use a prominent Frost color
cwd = { fg = "#5e81ac" } # nord8

# Deprecated: Hovered item - Simple reverse video often works best
hovered = { reversed = true }
preview_hovered = { underline = true }

# Find results - Use Aurora colors for highlighting
find_keyword = { fg = "#a3761c", bold = true, italic = true, underline = true } # nord13 (Yellow)
find_position = { fg = "#9f6f96", bg = "reset", bold = true, italic = true }    # nord15 (Purple)

# Marker - Use Aurora colors, mimicking common diff/status colors
marker_copied = { fg = "#67874c", bg = "#67874c" }   # nord14 (Green)
marker_cut = { fg = "#bf616a", bg = "#bf616a" }      # nord11 (Red)
marker_marked = { fg = "#3e879c", bg = "#3e879c" }   # nord7 (Frost Mint)
marker_selected = { fg = "#a3761c", bg = "#a3761c" } # nord13 (Yellow)

# Deprecated Tab - Active tab reversed, inacvtive slightly muted
tab_active = { reversed = true }
tab_inactive = { fg = "#a4aab6" } # nord3
tab_width = 1

# Count badges - Use marker background colors with dark text for contrast
count_copied = { fg = "#eceff4", bg = "#67874c" }   # nord0 on nord14
count_cut = { fg = "#eceff4", bg = "#bf616a" }      # nord0 on nord11
count_selected = { fg = "#eceff4", bg = "#a3761c" } # nord0 on nord13

# Border - Use a subtle Polar Night color
border_symbol = "│"
border_style = { fg = "#a4aab6" } # nord3

# : }}}


# : Tabs {{{

[tabs]

# Tabs Active/Inactive - Use Frost Mint for active, Polar Night for inactive
active = { fg = "#eceff4", bg = "#3e879c", bold = true } # nord0 on nord7 (Teal/Mint)
inactive = { fg = "#3e879c", bg = "#e5e9f0" }            # nord7 on nord1

# : }}}


# : Mode {{{

[mode]
# Use distinct Frost/Aurora colors for mode backgrounds, dark text
# Changed normal mode background to nord7 (Teal/Mint)
normal_main = { fg = "#eceff4", bg = "#3e879c", bold = true } # nord0 on nord7 (Teal/Mint)
normal_alt = { fg = "#3e879c", bg = "#e5e9f0" }               # nord7 on nord1

# Select mode remains nord7 (Teal/Mint)
select_main = { fg = "#eceff4", bg = "#3e879c", bold = true } # nord0 on nord7 (Teal/Mint)
select_alt = { fg = "#3e879c", bg = "#e5e9f0" }               # nord7 on nord1

# Unset mode remains nord11 (Red)
unset_main = { fg = "#eceff4", bg = "#bf616a", bold = true } # nord0 on nord11 (Red)
unset_alt = { fg = "#bf616a", bg = "#e5e9f0" }               # nord11 on nord1

# : }}}


# : Status bar {{{

[status]
# Permissions - Use Aurora colors semantically
perm_sep = { fg = "#a4aab6" }   # nord3
perm_type = { fg = "#5782ac" }  # nord9 (Blue) - Directory/type indicator
perm_read = { fg = "#a3761c" }  # nord13 (Yellow) - Read permission
perm_write = { fg = "#bf616a" } # nord11 (Red) - Write permission (often more restricted)
perm_exec = { fg = "#67874c" }  # nord14 (Green) - Execute permission

# Progress bar - Use a Frost blue for normal, Aurora red for error
progress_label = { fg = "#3b4252", bold = true }     # nord6
progress_normal = { fg = "#5e81ac", bg = "#c4dce6" } # nord8 on nord2
progress_error = { fg = "#bf616a", bg = "#c4dce6" }  # nord11 on nord2

# : }}}


# : Pick {{{

[pick]
# File picker - Use a Frost blue for border, Aurora purple for active item
border = { fg = "#5782ac" }              # nord9
active = { fg = "#9f6f96", bold = true } # nord15 (Purple)
inactive = { fg = "#2e3440" }            # nord4 - Default text color

# : }}}


# : Input {{{

[input]
# Input prompts - Frost blue border, default text, reverse selection
border = { fg = "#5782ac" }    # nord9
title = { fg = "#2e3440" }     # nord4
value = { fg = "#3b4252" }     # nord6 - Slightly brighter for input value
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
# Completion menu - Frost blue border
border = { fg = "#5782ac" } # nord9

# : }}}


# : Tasks {{{

[tasks]
# Tasks window - Frost blue border, Aurora purple for hovered task
border = { fg = "#5782ac" }                    # nord9
title = { fg = "#3b4252" }                     # nord6
hovered = { fg = "#9f6f96", underline = true } # nord15 (Purple)

# : }}}


# : Which {{{

[which]
# Keybinding helper (which-key style)
mask = { bg = "#e5e9f0" }            # nord1 - Slightly lighter background for overlay
cand = { fg = "#3e879c" }            # nord7 (Frost Mint) - Candidate keys
rest = { fg = "#a4aab6" }            # nord3 - Remaining keys in sequence (muted)
desc = { fg = "#9f6f96" }            # nord15 (Purple) - Command description
separator = "  "                    # Or " > " or " :: "
separator_style = { fg = "#c4dce6" } # nord2 - Darker separator

# : }}}


# : Help {{{

[help]
# Help screen
on = { fg = "#3e879c" }                     # nord7 (Frost Mint) - Keybinding section label
run = { fg = "#9f6f96" }                    # nord15 (Purple) - Command section label
hovered = { reversed = true, bold = true }  # Hovered key/command
footer = { fg = "#eceff4", bg = "#3b4252" } # nord0 on nord6 - High contrast footer

# : }}}


# : Notify {{{

[notify]
# Notification popups - Use Aurora colors for severity levels
title_info = { fg = "#67874c" }  # nord14 (Green)
title_warn = { fg = "#a3761c" }  # nord13 (Yellow)
title_error = { fg = "#bf616a" } # nord11 (Red)

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
# Images - Frost Mint/Cyan
{ mime = "image/*", fg = "#3e879c" }, # nord7

# Media (Audio/Video) - Aurora Yellow
{ mime = "{audio,video}/*", fg = "#a3761c" }, # nord13

# Archives - Aurora Purple
{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#9f6f96" }, # nord15

# Documents - Aurora Green
{ mime = "application/{pdf,doc,rtf,odt,docx,xlsx,pptx}", fg = "#67874c" }, # nord14

# For symlinks - Purple
{ url = "*", is="link", fg = "#9f6f96" }, # nord15

# Fallback file - Default Snow Storm text color
{ url = "*", fg = "#2e3440" }, # nord4

# Fallback directory - Frost Blue
{ url = "*/", fg = "#5782ac", bold = true }, # nord9
]

 # : }}}


# : Icon colors {{{

[icon]
# Override specific hidden directory icons to match nord9
prepend_dirs = [
    { name = ".config", text = "\ue5fc", fg = "#5782ac" },
    { name = ".git", text = "\ue5fb", fg = "#5782ac" },
    { name = ".github", text = "\ue5fd", fg = "#5782ac" },
    { name = ".npm", text = "\ue5fa", fg = "#5782ac" },
]
# Generic fallback for non-hidden directories
prepend_conds = [
    { if = "dir & !hidden", text = "\ue5ff", fg = "#5782ac" }, # nord9
]

 # : }}}
