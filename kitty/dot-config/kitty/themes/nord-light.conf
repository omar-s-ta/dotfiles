# Nord light, to match nvim's colors/nord-light.lua (Helix's nord_light,
# mirrored). Nord's own palette on Snow Storm nord6 #ECEFF4, with the accents
# darkened to 3.5:1 so they read as text on a light background -- hue and
# saturation kept, only lightness lowered. See the header of
# nvim/dot-config/nvim/colors/nord-light.lua for the derivation.

background #ECEFF4
foreground #2E3440
# nord8 at 40% over nord6
selection_background #C4DCE6
selection_foreground none
cursor #5E81AC
cursor_text_color #ECEFF4
url_color #5E81AC

# Border (inactive: nord3 at 45% over nord6, 2.0:1)
active_border_color #5E81AC
inactive_border_color #A4AAB6
bell_border_color #C26446

# Tabs
active_tab_background #88C0D0
active_tab_foreground #2E3440
inactive_tab_background #D8DEE9
inactive_tab_foreground #4C566A
tab_bar_background #E5E9F0

# normal
# black is dark text (nord1), white the light surface (nord5): swapped
# roles from dark Nord, as every light palette does.
color0 #3B4252
color1 #BF616A
color2 #67874C
color3 #A3761C
color4 #5E81AC
color5 #9F6F96
color6 #3E879C
color7 #E5E9F0

# bright
color8 #4C566A
color9 #BF616A
color10 #67874C
color11 #A3761C
color12 #5782AC
color13 #9F6F96
color14 #518786
color15 #ECEFF4
