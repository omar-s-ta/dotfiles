font_family       BerkeleyMono Nerd Font Mono Plus Font Awesome Plus Font Awesome Extension Plus Octicons Plus Power Symbols Plus Codicons Plus Pomicons Plus Font Logos Plus Material Design Icons Plus Weather Icons
# font_family       ShureTechMono Nerd Font Mono
# font_family       IosevkaTerm Nerd Font Mono 
# font_family       FiraCode Nerd Font Mono
# font_family       SpaceMono Nerd Font Mono
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         16.0
disable_ligatures always

macos_option_as_alt yes

# Theme is handled by dark-theme.auto.conf and light-theme.auto.conf
#
# OS-appearance switching is DISABLED: kitty switches automatically whenever
# {dark,light,no-preference}-theme.auto.conf exist next to this file. They are
# parked in themes/os-switch/ -- move them back here (and drop the include
# below) to follow macOS light/dark again.
# include themes/dayfox.conf   # (Dayfox)
# include themes/dawnfox.conf  # (Dawnfox)
include themes/nord-light.conf
