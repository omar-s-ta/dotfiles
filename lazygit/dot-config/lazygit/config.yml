# lazygit config — Nord light theme.
# Nord light (nvim/dot-config/nvim/colors/nord-light.lua): Nord, text accents darkened
# to 3.5:1 on nord6
# --
# blue #5e81ac  blue.bright #5782ac  yellow #a3761c  red #bf616a
# magenta #9f6f96; border #a4aab6, selection #c4dce6.
gui:
  theme:
    activeBorderColor:
      # (Nord) - '#88C0D0' # nord8 (frost, bright)
      - "#5e81ac" # blue
      - bold
    inactiveBorderColor:
      # (Nord) - '#4C566A' # nord3
      - "#a4aab6" # border
    searchingActiveBorderColor:
      # (Nord) - '#EBCB8B' # nord13 (yellow)
      - "#a3761c" # yellow
      - bold
    optionsTextColor:
      # (Nord) - '#81A1C1' # nord9
      - "#5782ac" # blue.bright
    selectedLineBgColor:
      # (Nord) - '#3B4252' # nord1
      - "#e5e9f0" # nord5
    inactiveViewSelectedLineBgColor:
      # (Nord) - '#434C5E' # nord2
      - "#c4dce6" # visual
    defaultFgColor:
      # (Nord) - '#D8DEE9' # nord4
      - "#2e3440" # nord0
    cherryPickedCommitBgColor:
      # (Nord) - '#434C5E' # nord2
      - "#c4dce6" # visual
    cherryPickedCommitFgColor:
      # (Nord) - '#88C0D0' # nord8
      - "#5e81ac" # blue
    markedBaseCommitBgColor:
      # (Nord) - '#434C5E' # nord2
      - "#c4dce6" # visual
    markedBaseCommitFgColor:
      # (Nord) - '#EBCB8B' # nord13
      - "#a3761c" # yellow
    unstagedChangesColor:
      # (Nord) - '#BF616A' # nord11 (red)
      - "#bf616a" # red
    authorColors:
      # (Nord) '*': '#B48EAD' # nord15 (purple)
      "*": "#9f6f96" # magenta
