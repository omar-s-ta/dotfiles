# -----------------------------------------------------------------------------
# K9s Nord light skin, matching nvim/kitty/tmux. The palette in
# nvim/dot-config/nvim/colors/nord-light.lua: Nord, accents darkened to 3.5:1 on
# nord6.
# # -----------------------------------------------------------------------------

# Styles...
foreground: &foreground "#2e3440" # nord0
background: &background "#eceff4" # nord6
current_line: &current_line "#c4dce6" # visual
selection: &selection "#c4dce6" # visual
comment: &comment "#828a99" # comment
cyan: &cyan "#3e879c" # cyan
green: &green "#67874c" # green
orange: &orange "#c26446" # orange
magenta: &magenta "#9f6f96" # magenta
blue: &blue "#5e81ac" # blue
red: &red "#bf616a" # red
border: &border "#a4aab6" # border
surface: &surface "#e5e9f0" # nord5
active: &active "#88c0d0" # nord8

# Skin...
k9s:
  body:
    fgColor: *foreground
    bgColor: *background
    logoColor: *blue
  prompt:
    fgColor: *foreground
    bgColor: *background
    suggestColor: *orange
  info:
    fgColor: *magenta
    sectionColor: *foreground
  dialog:
    fgColor: *foreground
    bgColor: *background
    buttonFgColor: *background
    buttonBgColor: *magenta
    buttonFocusFgColor: white
    buttonFocusBgColor: *cyan
    labelFgColor: *orange
    fieldFgColor: *foreground
  frame:
    border:
      fgColor: *border
      focusColor: *blue
    menu:
      fgColor: *foreground
      keyColor: *magenta
      numKeyColor: *magenta
    crumbs:
      fgColor: *foreground
      bgColor: *surface
      activeColor: *active
    status:
      newColor: *cyan
      modifyColor: *blue
      addColor: *green
      errorColor: *red
      highlightColor: *orange
      killColor: *comment
      completedColor: *comment
    title:
      fgColor: *foreground
      bgColor: *surface
      highlightColor: *orange
      counterColor: *blue
      filterColor: *magenta
  views:
    charts:
      bgColor: default
      defaultDialColors:
        - *blue
        - *red
      defaultChartColors:
        - *blue
        - *red
    table:
      fgColor: *foreground
      bgColor: *background
      cursorFgColor: *selection
      cursorBgColor: *current_line
      header:
        fgColor: *foreground
        bgColor: *background
        sorterColor: *cyan
    xray:
      fgColor: *foreground
      bgColor: *background
      cursorColor: *current_line
      graphicColor: *blue
      showIcons: false
    yaml:
      keyColor: *magenta
      colonColor: *blue
      valueColor: *foreground
    logs:
      fgColor: *foreground
      bgColor: *background
      indicator:
        fgColor: *foreground
        bgColor: *selection
        toggleOnColor: *magenta
        toggleOffColor: *blue
